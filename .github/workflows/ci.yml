name: Verify and publish Kavu
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kavu-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run evaluate
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Build and smoke-test production container
        run: |
          docker build -t kavu:ci .
          docker run -d --name kavu-ci --read-only --tmpfs /tmp -v kavu-ci-data:/app/var -e APP_ORIGIN=https://kavu.example.test -p 127.0.0.1:3002:3001 kavu:ci
          curl --retry 5 --retry-delay 2 --retry-connrefused --fail http://127.0.0.1:3002/api/health
          docker rm -f kavu-ci
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_DEMO_ONLY: 'true'
          VITE_BASE_PATH: /Hack-The-Weather/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish demo
        id: deploy
        uses: actions/deploy-pages@v4
