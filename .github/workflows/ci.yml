name: Verify and publish Kavu
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kavu-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify durable Firestore adapter without cloud credentials
        run: npm exec --yes --package=firebase-tools@15.30.2 -- firebase emulators:exec --only firestore --project demo-kavu-ci --config firebase.emulator.json 'npx vitest run tests/firestore-store.test.ts'
        env:
          FIRESTORE_TEST_PROJECT: demo-kavu-ci
      - run: npm run evaluate
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Build and smoke-test production container
        run: |
          docker build -t kavu:ci .
          docker run -d --name kavu-ci --read-only --tmpfs /tmp -v kavu-ci-data:/app/var -e APP_ORIGIN=https://kavu.example.test -p 127.0.0.1:3002:3001 kavu:ci
          curl --retry 10 --retry-delay 1 --retry-all-errors --max-time 3 --fail http://127.0.0.1:3002/api/health || { docker logs kavu-ci; exit 1; }
          docker rm -f kavu-ci
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_DEMO_ONLY: 'true'
          VITE_BASE_PATH: /Hack-The-Weather/
      - run: npx playwright install --with-deps chromium
      - name: Verify public demo works offline
        run: |
          VITE_BASE_PATH=/Hack-The-Weather/ npx vite preview --host 127.0.0.1 --port 4173 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          curl --retry 10 --retry-delay 1 --retry-all-errors --max-time 3 --fail http://127.0.0.1:4173/Hack-The-Weather/ > /dev/null
          npm run test:static
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish demo
        id: deploy
        uses: actions/deploy-pages@v4
